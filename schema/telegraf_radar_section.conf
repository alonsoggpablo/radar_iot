# =============================================================================
# Sección del telegraf.conf de Nexus para ingestar eventos de uRAD Smart Traffic.
#
# Copiar este bloque al final del `[[inputs.mqtt_consumer]]` y `[[processors.starlark]]`
# de `/root/nexus/telegraf/telegraf.conf`, y añadir "nexus_radar" al `namepass` del
# `[[outputs.postgresql]]` final.
#
# Topics consumidos: aglabs/radar/<site>/<sensor>/{track,event}
# Topics ignorados (broker-only, retained): state, $health
# Tabla destino:    nexus_radar  (ver schema/nexus_radar.sql)
# =============================================================================

# -- uRAD Smart Traffic — track + event ----------------------------------------
# Topic: aglabs/radar/<site>/<sensor>/<kind>
# Payload JSON: ver bridge/aglabs_radar_bridge.py — campos pre-aplanados
#               (ts, type, type_label, velocity_kmh, velocity_signed_kmh,
#                direction, x_distance_m, external_event_id, fw_raw, ...)
[[inputs.mqtt_consumer]]
  servers   = ["ssl://${MQTT_BROKER}:${MQTT_PORT}"]
  topics    = ["aglabs/radar/+/+/track", "aglabs/radar/+/+/event"]
  qos       = 1
  client_id = "nexus-radar"
  username  = "${MQTT_USERNAME}"
  password  = "${MQTT_PASSWORD}"
  insecure_skip_verify = true

  data_format        = "json"
  json_string_fields = ["ts", "site", "sensor", "type_label", "direction",
                        "external_event_id", "fw_raw", "kind"]

  # aglabs / radar / <site> / <sensor> / <kind_suffix>
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "aglabs/radar/+/+/track"
    tags  = "_/_/site/device_id/topic_kind"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "aglabs/radar/+/+/event"
    tags  = "_/_/site/device_id/topic_kind"

  [inputs.mqtt_consumer.tags]
    typology = "radar"


# -- Starlark: aplana JSON → metric nexus_radar -------------------------------
# Para topic_kind='track' usa el `type` numérico del payload y kind='track'.
# Para topic_kind='event' el campo 'kind' del payload (speed_violation, ...) toma precedencia.
[[processors.starlark]]
  order    = 10
  tagpass  = {typology = ["radar"]}
  namepass = ["mqtt_consumer"]
  source = '''
def _to_float(v):
    if v == None:
        return None
    s = str(v).strip()
    if s == "" or s == "None":
        return None
    return float(s)

def _to_int(v):
    f = _to_float(v)
    if f == None:
        return None
    return int(f)

def apply(metric):
    topic_kind = metric.tags.pop("topic_kind", "")
    device_id  = metric.tags.get("device_id", "")
    site       = metric.tags.pop("site", "")

    if not device_id:
        return None

    # Para tracks el kind del payload viene de topic; para events viene del propio JSON.
    if topic_kind == "track":
        kind = "track"
    else:
        kind = str(metric.fields.get("kind", "")) or "event"

    ts_iso = str(metric.fields.get("ts", ""))
    eid    = str(metric.fields.get("external_event_id", ""))
    if not ts_iso or not eid:
        return None

    new_fields = {
        "kind":              kind,
        "external_event_id": eid,
    }
    if site:
        new_fields["site"] = site

    # Campos comunes presentes en track y en speed_violation
    otype = _to_int(metric.fields.get("type"))
    if otype != None:
        new_fields["object_type"] = otype

    tlabel = metric.fields.get("type_label")
    if tlabel != None:
        new_fields["type_label"] = str(tlabel)

    v_abs = _to_float(metric.fields.get("velocity_kmh"))
    if v_abs != None:
        new_fields["velocity_kmh"] = v_abs

    v_sig = _to_float(metric.fields.get("velocity_signed_kmh"))
    if v_sig != None:
        new_fields["velocity_signed_kmh"] = v_sig

    direction = metric.fields.get("direction")
    if direction != None:
        new_fields["direction"] = str(direction)

    x_m = _to_float(metric.fields.get("x_distance_m"))
    if x_m != None:
        new_fields["x_distance_m"] = x_m

    # Específico de speed_violation
    measured = _to_float(metric.fields.get("measured_kmh"))
    if measured != None and "velocity_kmh" not in new_fields:
        new_fields["velocity_kmh"] = measured
    limit = _to_float(metric.fields.get("limit_kmh"))
    if limit != None:
        new_fields["speed_limit_kmh"] = limit

    fw_raw = metric.fields.get("fw_raw")
    if fw_raw != None:
        new_fields["fw_raw"] = str(fw_raw)

    # Sobrescribir `time` con el `ts` del payload (cuando lo detectó el firmware)
    # Telegraf espera nanoseconds desde epoch como int.
    # ts viene en ISO 8601 con sufijo Z; parseamos manualmente porque Starlark
    # no tiene strptime. Esperamos formato 'YYYY-MM-DDTHH:MM:SS.fffZ'.
    # Si falla cualquier parseo, conservamos el time de ingesta (no-op).
    parsed = _parse_iso8601_ns(ts_iso)
    if parsed != None:
        metric.time = parsed

    metric.fields.clear()
    for k, v in new_fields.items():
        metric.fields[k] = v

    metric.tags.pop("typology", None)
    metric.tags.pop("topic",    None)
    # device_id ya está en tags via topic_parsing — se mantiene como columna.

    metric.name = "nexus_radar"
    return metric


def _parse_iso8601_ns(s):
    # 'YYYY-MM-DDTHH:MM:SS.fffZ'  o 'YYYY-MM-DDTHH:MM:SSZ'
    if len(s) < 20:
        return None
    if s[-1] != "Z":
        return None
    body = s[:-1]            # quitar Z
    parts = body.split("T")
    if len(parts) != 2:
        return None
    d = parts[0].split("-")
    if len(d) != 3:
        return None
    Y = int(d[0]); M = int(d[1]); D = int(d[2])

    t = parts[1].split(":")
    if len(t) != 3:
        return None
    h = int(t[0]); mi = int(t[1])
    sec_ms = t[2].split(".")
    sec = int(sec_ms[0])
    ms = int(sec_ms[1]) if len(sec_ms) > 1 else 0

    # Días por mes (incluye bisiesto)
    is_leap = (Y % 4 == 0 and Y % 100 != 0) or (Y % 400 == 0)
    days_in_month = [31, 29 if is_leap else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]

    # Días desde 1970-01-01
    days = 0
    for y in range(1970, Y):
        leap = (y % 4 == 0 and y % 100 != 0) or (y % 400 == 0)
        days += 366 if leap else 365
    for m in range(M - 1):
        days += days_in_month[m]
    days += D - 1

    secs = days * 86400 + h * 3600 + mi * 60 + sec
    return secs * 1000000000 + ms * 1000000
'''
